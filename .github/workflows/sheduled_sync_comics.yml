name: Scheduled Comic Vine Sync

on:
  workflow_dispatch:
  schedule:
    # Runs once every hour at minute 17 UTC.
    # GitHub Actions scheduled runs can be delayed, but the intended trigger interval is hourly.
    - cron: "17 * * * *"

concurrency:
  group: comicvine-sync
  cancel-in-progress: false

jobs:
  sync-comics:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"

    steps:
      - name: Show sync trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Run number: ${{ github.run_number }}"
          echo "UTC start time:"
          date -u

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run Comic Vine sync
        run: python manage.py sync_comics
