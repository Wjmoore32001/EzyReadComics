<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EzyReadComics{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .clickable-row {
            cursor: pointer;
        }

        .clickable-row:hover {
            --bs-table-bg: rgba(255, 255, 255, 0.06);
        }

        .small-muted {
            color: var(--bs-secondary-color);
            font-size: 0.875rem;
        }

        .description-block {
            white-space: pre-line;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom border-secondary bg-body-tertiary">
    <div class="container">
        <a href="{% url 'catalog:home' %}" class="navbar-brand fw-bold">
            EzyReadComics
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-navbar"
            aria-controls="main-navbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-navbar">
            <div class="navbar-nav me-auto">
                <a href="{% url 'catalog:home' %}" class="nav-link">
                    Home
                </a>
                <a href="{% url 'catalog:browse' %}" class="nav-link">
                    Browse
                </a>
                <a href="/admin/" class="nav-link">
                    Admin
                </a>
            </div>

            <div class="d-flex gap-2">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'account' %}" class="btn btn-outline-light btn-sm">
                        Account
                    </a>

                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                        Log in
                    </a>

                    <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">
    {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} mb-2">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
<script>
    document.querySelectorAll("[data-row-url]").forEach((row) => {
        row.addEventListener("click", (event) => {
            if (event.target.closest("a, button, input, select, textarea")) {
                return;
            }

            window.location.href = row.dataset.rowUrl;
        });
    });
</script>
</body>
</html>
