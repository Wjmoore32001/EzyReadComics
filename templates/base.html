<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EzyReadComics{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom border-secondary bg-body-tertiary">
    <div class="container">
        <span class="navbar-brand fw-bold">
            EzyReadComics
        </span>

        <div class="d-flex gap-2">
            {% if request.user.is_authenticated %}
                <a href="{% url 'account' %}" class="btn btn-outline-light btn-sm">
                    Account
                </a>

                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        Log out
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Log in
                </a>

                <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">
                    Sign up
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} mb-2">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
</body>
</html>
